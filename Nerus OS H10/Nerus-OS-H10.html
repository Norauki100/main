<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nerus OS H10</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen">

    <!-- Desktop Icons Container -->
    <div class="fixed top-0 left-0 p-5 z-10 space-y-5">
        <!-- Nerus Browser -->
        <div id="nerus-browser" class="app-icon w-22 h-22 flex flex-col items-center justify-center text-center rounded-lg cursor-pointer hover:bg-white hover:bg-opacity-10 transition-all duration-200" onclick="openApp('nerus-browser')">
            <div class="w-11 h-11 mb-1.5 text-4xl flex items-center justify-center">🌐</div>
            <p class="text-sm font-semibold">Nerus Browser</p>
        </div>

        <!-- Desktop Note -->
        <div id="desktop-note" class="app-icon w-22 h-22 flex flex-col items-center justify-center text-center rounded-lg cursor-pointer hover:bg-white hover:bg-opacity-10 transition-all duration-200" onclick="openApp('desktop-note')">
            <div class="w-11 h-11 mb-1.5 text-4xl flex items-center justify-center">📝</div>
            <p class="text-sm font-semibold">omg note</p>
        </div>

        <!-- Nerus Calculator -->
        <div id="nerus-calculator" class="app-icon w-22 h-22 flex flex-col items-center justify-center text-center rounded-lg cursor-pointer hover:bg-white hover:bg-opacity-10 transition-all duration-200" onclick="openApp('nerus-calculator')">
            <div class="w-11 h-11 mb-1.5 text-4xl flex items-center justify-center">🧮</div>
            <p class="text-sm font-semibold">Nerus Calculator</p>
        </div>

        <!-- Nerus Paint Tool -->
        <div id="nerus-paint-tool" class="app-icon w-22 h-22 flex flex-col items-center justify-center text-center rounded-lg cursor-pointer hover:bg-white hover:bg-opacity-10 transition-all duration-200" onclick="openApp('nerus-paint-tool')">
            <div class="w-11 h-11 mb-1.5 text-4xl flex items-center justify-center">🖌️</div>
            <p class="text-sm font-semibold">Nerus Paint Tool</p>
        </div>

        <!-- File Explorer -->
        <div id="file-explorer" class="app-icon w-22 h-22 flex flex-col items-center justify-center text-center rounded-lg cursor-pointer hover:bg-white hover:bg-opacity-10 transition-all duration-200" onclick="openApp('file-explorer')">
            <div class="w-11 h-11 mb-1.5 text-4xl flex items-center justify-center">📁</div>
            <p class="text-sm font-semibold">File Explorer</p>
        </div>
    </div>

    <!-- Application Window Container -->
    <div id="app-window-container" class="fixed inset-0 pointer-events-none p-4 flex flex-col items-center justify-center z-20"></div>

    <!-- Taskbar -->
    <div id="taskbar" class="fixed bottom-0 left-0 right-0 h-14 bg-gray-900 bg-opacity-70 backdrop-blur-50-percent flex items-center justify-between px-4 z-50">
        <!-- Left: Start Button, Search Bar, App Icons -->
        <div class="flex items-center space-x-4">
            <!-- Start Button -->
            <button id="start-button" class="group w-12 h-12 flex items-center justify-center rounded-lg hover:bg-white hover:bg-opacity-10 transition-all duration-200">
                <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>

            <!-- Search Bar -->
            <div class="relative">
                <div class="relative flex items-center">
                    <input type="text" 
                           id="taskbar-search" 
                           placeholder="検索" 
                           class="w-48 bg-gray-700 bg-opacity-70 text-white px-3 py-1.5 rounded-full border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent pl-10 text-sm transition-all duration-200"
                           style="min-width: 150px;">
                    <svg class="w-4 h-4 text-gray-400 absolute left-3" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                </div>
            </div>

            <!-- Open App Icons -->
            <div id="taskbar-icons" class="flex items-center space-x-2">
                <!-- App icons will be dynamically added here -->
            </div>
        </div>

        <!-- Right: Date & Time -->
        <div class="flex flex-col items-end pr-2">
            <div id="clock" class="text-white text-sm font-medium text-right">00:00:00</div>
            <div id="date" class="text-white text-xs text-gray-300">2023/01/01 (月)</div>
        </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="bg-gray-800 bg-opacity-70 backdrop-blur-50-percent shadow-2xl p-6 flex-col">
        <!-- Search Bar -->
        <div class="relative mb-6">
            <div class="relative">
                <input type="text" placeholder="検索" class="w-full bg-gray-700 bg-opacity-50 text-white px-12 py-3 rounded-full border border-gray-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent pl-12">
                <svg class="w-5 h-5 text-gray-400 absolute left-4 top-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                </svg>
            </div>
        </div>

        <!-- All Apps -->
        <div class="mb-4">
            <h3 class="text-gray-300 text-sm font-medium mb-3">すべてのアプリ</h3>
            <div class="grid grid-cols-4 gap-3 overflow-y-auto" style="max-height: 400px;">
                <!-- App 1 - Nerus Browser -->
                <div class="flex flex-col items-center text-center p-3 rounded-xl hover:bg-gray-700 transition-colors cursor-pointer" onclick="openApp('nerus-browser')">
                    <div class="w-10 h-10 bg-blue-500 rounded-xl flex items-center justify-center text-white text-xl mb-1">🌐</div>
                    <span class="text-xs text-white">Nerus Browser</span>
                </div>
                <!-- App 2 - omg note -->
                <div class="flex flex-col items-center text-center p-3 rounded-xl hover:bg-gray-700 transition-colors cursor-pointer" onclick="openApp('desktop-note')">
                    <div class="w-10 h-10 bg-green-500 rounded-xl flex items-center justify-center text-white text-xl mb-1">📝</div>
                    <span class="text-xs text-white">omg note</span>
                </div>
                <!-- App 3 - File Explorer -->
                <div class="flex flex-col items-center text-center p-3 rounded-xl hover:bg-gray-700 transition-colors cursor-pointer" onclick="openApp('file-explorer')">
                    <div class="w-10 h-10 bg-purple-500 rounded-xl flex items-center justify-center text-white text-xl mb-1">📁</div>
                    <span class="text-xs text-white">File Explorer</span>
                </div>
                <!-- App 4 - Paint Tool -->
                <div class="flex flex-col items-center text-center p-3 rounded-xl hover:bg-gray-700 transition-colors cursor-pointer" onclick="openApp('nerus-paint-tool')">
                    <div class="w-10 h-10 bg-yellow-500 rounded-xl flex items-center justify-center text-white text-xl mb-1">🎨</div>
                    <span class="text-xs text-white">Paint Tool</span>
                </div>
                <!-- App 5 - Calculator -->
                <div class="flex flex-col items-center text-center p-3 rounded-xl hover:bg-gray-700 transition-colors cursor-pointer" onclick="openApp('nerus-calculator')">
                    <div class="w-10 h-10 bg-red-500 rounded-xl flex items-center justify-center text-white text-xl mb-1">📊</div>
                    <span class="text-xs text-white">Calculator</span>
                </div>
                <!-- App 6 - Settings -->
                <div class="flex flex-col items-center text-center p-3 rounded-xl hover:bg-gray-700 transition-colors cursor-pointer" onclick="openApp('settings')">
                    <div class="w-10 h-10 bg-gray-500 rounded-xl flex items-center justify-center text-white text-xl mb-1">⚙️</div>
                    <span class="text-xs text-white">設定</span>
                </div>
            </div>
        </div>

        <!-- User Info & Power -->
        <div class="flex items-center justify-between pt-4 border-t border-gray-700">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-lg font-bold text-gray-800">U</div>
                <div>
                    <p class="font-semibold text-white text-sm">Guest User</p>
                </div>
            </div>
            <button class="p-2 rounded-full hover:bg-gray-700 transition-colors">
                <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>
    </div>
    
    <!-- Custom JavaScript -->
    <script src="app.js"></script>
</body>
</html>
